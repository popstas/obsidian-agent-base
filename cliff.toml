[changelog]
# Только вечные утверждения о проекте — верны для любого релиза, поэтому
# безопасно перегенерировать их заново каждый раз. Номера версии тут нет
# нарочно: version определяется per-release в body (см. ниже). Раньше здесь
# был захардкожен "## 0.1.0" — следующий релиз молча подшивался бы под ним
# же, потому что header рендерится один раз на весь файл, а не на релиз.
header = """
# Changelog

> Дневные логи лежат вложенно — `Log/YYYY/MM/YYYY-MM-DD.md`; недельные отчёты по-прежнему лежат плоско в `Log/Reports/`.
>
> Репозиторий до-единичный: breaking changes едут минорным бампом, с пометкой BREAKING под версией, где они случились.

"""
# В отличие от header, body рендерится отдельно для каждого релиза (git-cliff
# группирует коммиты по тегам), поэтому номер версии и BREAKING-пометка тут —
# per-release. BREAKING берётся из commit.breaking_description — из трейлера
# `BREAKING CHANGE:` коммита aa55b74 — а не вписан руками, поэтому остаётся
# у того релиза, где случился, и не переезжает вместе с header.
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }}
{% else %}\
## Unreleased
{% endif %}
{% for commit in commits %}{% if commit.breaking %}
> **BREAKING.** {{ commit.breaking_description }}
{% endif %}{% endfor %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
commit_preprocessors = [
  # Тема коммита d1829f6 ("docs: replace Planfix example with generic
  # CRM") называет приватный термин из локального (gitignored,
  # cliff.toml его не видит) списка .privacy-terms напрямую. Это законный
  # docs-коммит — запись в чейнджлоге осмысленна, проблема только в
  # слове внутри неё, поэтому skip (как для ba2850e) здесь не годится:
  # он выбросил бы всю запись. commit_preprocessors правят текст самого
  # сообщения до группировки — без этого правила регенерация вернёт
  # Planfix в публичный CHANGELOG.md. Замена согласована с уже
  # переформулированной вручную строкой в CHANGELOG.md ("vendor-specific
  # tracker"), чтобы текст не расходился между ручной и генерируемой
  # версией.
  { pattern = "Planfix", replace = "vendor-specific tracker" },
]
commit_parsers = [
  # Тема этого коммита называет приватный термин из .privacy-terms
  # (Planfix) напрямую — сам коммит служебный (правка одной строки
  # CHANGELOG.md), поэтому в генерируемом чейнджлоге ему не место в любом
  # случае. Привязка по sha, а не по подстроке "Planfix" или по всему
  # "^fix" — иначе legit-коммит на ту же тему когда-нибудь молча
  # потеряется. Правило должно идти раньше правил по message ниже: у
  # git-cliff первое совпадение в списке решает судьбу коммита, а тема
  # начинается с "fix:" и иначе попала бы в Bug Fixes раньше, чем очередь
  # дойдёт сюда.
  { sha = "ba2850e955881d1c8da752ace4ca6f717b273f63", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^docs", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^refactor", group = "Refactor" },
  # Без явного правила git-cliff берёт группу из самого типа и прогоняет её
  # через upper_first — в заголовке релиза получалось "### Ci".
  { message = "^ci", group = "CI" },
  { message = "^chore", skip = true },
]
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
