name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      # Ноги независимы: красный macOS не должен отменять ubuntu и windows —
      # именно на macOS ожидаются находки, и остальные результаты в этот
      # момент нужны целиком.
      fail-fast: false
      matrix:
        # macos-latest — основная целевая ОС проекта: там системный bash 3.2 и
        # BSD-userland (sed, grep, mktemp), поведение которых отличается от GNU.
        # До добавления этой ноги scripts/install-obsidian-plugins.sh не
        # исполнялся на macOS ни разу.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      # На macOS-раннере GitHub в PATH первым стоит Homebrew-bash 5.x, а
      # проверять нужно системный /bin/bash 3.2 — голый "bash" молча гонял бы
      # тесты не по той реализации и давал бы зелёный тик, не доказывающий
      # ничего (та же ловушка, что на Windows, где "bash" из PATH разрешался
      # в WSL вместо Git Bash). Тесты берут этот путь из OAB_BASH и на
      # PATH-bash при ошибке не откатываются.
      OAB_BASH: ${{ matrix.os == 'macos-latest' && '/bin/bash' || 'bash' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # pwsh предустановлен на всех трёх раннерах (ubuntu-latest,
      # windows-latest, macos-latest). Если этот шаг однажды упадёт — значит
      # PowerShell-тесты в npm test перестали выполняться и молча
      # пропускаются, а не что pwsh не нужен.
      - run: pwsh --version
      # Какой именно bash исполняет .sh — в логе прогона отдельной строкой.
      # Без неё зелёный тик на macOS невозможно отличить от "гоняли Homebrew
      # 5.x"; та же информация дублируется диагностикой теста "bash-раннер
      # тестов" внутри npm test.
      - name: bash runner
        shell: bash
        run: |
          echo "OAB_BASH=$OAB_BASH"
          "$OAB_BASH" --version
      - run: npm test
      # Хуки не переживают clone, поэтому актуальность Skills list.md
      # гарантируется именно здесь.
      - name: Skills list.md is up to date
        run: |
          npm run gen:skills-list
          git diff --exit-code -- "skills/Skills list.md"
